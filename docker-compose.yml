services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fairdrop
      POSTGRES_USER: fairdrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairdrop -d fairdrop"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8025:8025"

  migrate:
    build: .
    restart: "no"
    command: ["sh", "-c", "node scripts/migrate.mjs && node scripts/seed-database.mjs"]
    environment: &app-environment
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://fairdrop:${POSTGRES_PASSWORD}@postgres:5432/fairdrop
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DRAW_ENCRYPTION_KEY: ${DRAW_ENCRYPTION_KEY:?Set DRAW_ENCRYPTION_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Fair Drop <no-reply@fairdrop.local>}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      POW_DIFFICULTY_BITS: ${POW_DIFFICULTY_BITS:-16}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  app:
    build: .
    restart: unless-stopped
    environment: *app-environment
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "server/worker.js"]
    environment: *app-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
